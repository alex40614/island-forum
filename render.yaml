services:
  - type: web
    name: island-forum-backend
    runtime: python
    repo: https://github.com/alex40614/island-forum
    branch: master
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./island_forum.db
      - key: PYTHONUNBUFFERED
        value: "1"
    healthCheckPath: /api/health
    plan: free
    region: singapore
